name: Submit iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: "EAS build ID to submit (from eas build / the Expo dashboard)"
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Submit to App Store Connect
        working-directory: apps/beacon
        run: npx eas-cli submit --platform ios --non-interactive --id "${{ github.event.inputs.buildId }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
