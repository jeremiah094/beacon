name: Configure custom domain (EAS Hosting)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (safe, read-only eas-cli calls) or configure (attempt to add/assign beaconproject.eu + www)"
        type: choice
        options:
          - discover
          - configure
        default: discover

permissions:
  contents: write

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Discover eas-cli domains commands
        if: ${{ github.event.inputs.mode == 'discover' }}
        working-directory: apps/beacon
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OUT=../../docs/domain-setup.md
          mkdir -p ../../docs
          {
            echo ""
            echo "## Discovery run — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "### eas-cli --version"
            echo '```'
            npx eas-cli --version 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli domains --help"
            echo '```'
            npx eas-cli domains --help 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli domains:list --help"
            echo '```'
            npx eas-cli domains:list --help 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli domains:list"
            echo '```'
            npx eas-cli domains:list --non-interactive 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli domains:configure --help"
            echo '```'
            npx eas-cli domains:configure --help 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli domains:assign --help"
            echo '```'
            npx eas-cli domains:assign --help 2>&1 || true
            echo '```'
          } >> "$OUT"

      - name: Configure beaconproject.eu + www
        if: ${{ github.event.inputs.mode == 'configure' }}
        working-directory: apps/beacon
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OUT=../../docs/domain-setup.md
          mkdir -p ../../docs
          {
            echo ""
            echo "## Configure run — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "### configure beaconproject.eu"
            echo '```'
            npx eas-cli domains:configure --domain beaconproject.eu --non-interactive 2>&1 || true
            echo '```'
            echo ""
            echo "### configure www.beaconproject.eu"
            echo '```'
            npx eas-cli domains:configure --domain www.beaconproject.eu --non-interactive 2>&1 || true
            echo '```'
            echo ""
            echo "### domains:list after configure"
            echo '```'
            npx eas-cli domains:list --non-interactive 2>&1 || true
            echo '```'
          } >> "$OUT"

      - name: Commit domain-setup.md
        run: |
          if [ -n "$(git status --porcelain -- docs/domain-setup.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/domain-setup.md
            git commit -m "Domain setup: ${{ github.event.inputs.mode }} run"
            git push
          fi
