name: Configure custom domain (EAS Hosting)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (eas-cli exploration) or verify (check DNS + HTTPS for beaconproject.eu)"
        type: choice
        options:
          - discover
          - verify
        default: discover

permissions:
  contents: write

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Discover eas-cli domains commands
        if: ${{ github.event.inputs.mode == 'discover' }}
        working-directory: apps/beacon
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OUT=../../docs/domain-setup.md
          mkdir -p ../../docs
          {
            echo ""
            echo "## Discovery run — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "### eas-cli --version"
            echo '```'
            npx eas-cli --version 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli --help (full command list)"
            echo '```'
            npx eas-cli --help --all 2>&1 || true
            echo '```'
            echo ""
            echo "### commands matching domain/hosting/alias/dns"
            echo '```'
            npx eas-cli --help --all 2>&1 | grep -iE "domain|hosting|alias|dns" || echo "(no matches)"
            echo '```'
            echo ""
            echo "### eas-cli deploy --help"
            echo '```'
            npx eas-cli deploy --help 2>&1 || true
            echo '```'
            echo ""
            echo "### eas-cli project:info --help"
            echo '```'
            npx eas-cli project:info --help 2>&1 || true
            echo '```'
          } >> "$OUT"

      - name: Verify DNS + HTTPS for beaconproject.eu
        if: ${{ github.event.inputs.mode == 'verify' }}
        run: |
          OUT=docs/domain-setup.md
          mkdir -p docs
          {
            echo ""
            echo "## Verify run — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "### A record: beaconproject.eu (expect 172.66.0.241)"
            echo '```'
            dig +short A beaconproject.eu 2>&1 || true
            echo '```'
            echo ""
            echo "### TXT record: _cf-custom-hostname.beaconproject.eu"
            echo '```'
            dig +short TXT _cf-custom-hostname.beaconproject.eu 2>&1 || true
            echo '```'
            echo ""
            echo "### CNAME record: _acme-challenge.beaconproject.eu"
            echo '```'
            dig +short CNAME _acme-challenge.beaconproject.eu 2>&1 || true
            echo '```'
            echo ""
            echo "### HTTPS check: https://beaconproject.eu"
            echo '```'
            curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s (final URL: %{url_effective})\n" --max-time 20 https://beaconproject.eu 2>&1 || true
            echo '```'
            echo ""
            echo "### A/CNAME record: www.beaconproject.eu"
            echo '```'
            dig +short www.beaconproject.eu 2>&1 || true
            echo '```'
            echo ""
            echo "### HTTPS check: https://www.beaconproject.eu"
            echo '```'
            curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s (final URL: %{url_effective})\n" --max-time 20 https://www.beaconproject.eu 2>&1 || true
            echo '```'
            echo ""
            echo "### verbose TLS/HTTP detail for www (to see the actual failure if any)"
            echo '```'
            curl -sSv --max-time 20 https://www.beaconproject.eu -o /dev/null 2>&1 | tail -40 || true
            echo '```'
          } >> "$OUT"

      - name: Commit domain-setup.md
        run: |
          if [ -n "$(git status --porcelain -- docs/domain-setup.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/domain-setup.md
            git commit -m "Domain setup: ${{ github.event.inputs.mode }} run"
            git push
          fi
